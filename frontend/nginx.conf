server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keine Versions-/Server-Preisgabe (v. a. beim direkten Tailscale-Zugriff).
  server_tokens off;

  # Kompression (greift auch beim direkten Tailscale-Zugriff auf :8080,
  # der nicht über Caddy läuft).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json font/woff2;

  # API ans Backend weiterleiten
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Gehashte Build-Assets sind unveränderlich -> ein Jahr cachen.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nie hart cachen, damit neue Deploys sofort greifen.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA-Fallback (Client-Routing)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
