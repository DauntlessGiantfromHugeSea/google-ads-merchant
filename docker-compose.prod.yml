# Produktions-Stack für north-flow.de mit automatischem HTTPS (Caddy).
# Start:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    # Nur lokal gebunden – für Tailscale-Zugriff (tailscale serve -> 127.0.0.1:8080).
    # Öffentlich bleibt alles über Caddy/north-flow.de erreichbar.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://reporting:${POSTGRES_PASSWORD}@db:5432/reporting
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /backups
      UPLOAD_DIR: /data/uploads
    expose:
      - "8000"
    volumes:
      # Nur lesend: Admin kann die Sicherungen über Tailscale herunterladen.
      - ./backups:/backups:ro
      # Hochgeladene Dateien (Datei-Anforderungen) – groß, daher auf der Platte.
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://reporting:${POSTGRES_PASSWORD}@db:5432/reporting
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reporting
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Nächtliche DB-Sicherung mit Rotation (Host-Ordner ./backups).
  # Optionaler Push zur Synology über die SYNOLOGY_*-Variablen in .env.prod.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      DB_HOST: db
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reporting
      BACKUP_DIR: /backups
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-8}
      # Leer lassen = kein Push; zum Aktivieren in .env.prod setzen:
      SYNOLOGY_RSYNC_TARGET: ${SYNOLOGY_RSYNC_TARGET:-}
      SYNOLOGY_SSH_PORT: ${SYNOLOGY_SSH_PORT:-22}
    volumes:
      - ./backups:/backups
      - ./deploy/backup/keys:/keys:ro   # optionaler SSH-Key für den Synology-Push
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
